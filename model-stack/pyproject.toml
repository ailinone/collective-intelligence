[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ailin-model-stack"
version = "0.1.0"
description = "Foundation model training stack for Ailin"
readme = "docs/README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [{ name = "Ailin Team" }]

dependencies = [
    # 2026-10-19 — SOTA refresh: every floor moved to the current (PyPI,
    # 2026-10-19) major of each framework, range-capped to the next major so
    # a fresh release can't silently break the training env overnight.
    # Validated set recorded in requirements-2026-10.txt; runtime-validated
    # by the "Integration Smoke" CI job (real torch/trl/vllm on the runner).
    # NOTE — transformers is capped <5.20, NOT at the latest 5.20.2: vllm
    # 0.32.0 (latest vllm) requires transformers>=5.16.1,<5.20.0. First CI
    # run of this branch proved >=5.20 is unresolvable alongside vllm
    # (ResolutionImpossible, run 39310116258) — the ecosystem frontier is
    # what vLLM ships against, so 5.19.0 is the real SOTA-compatible pick.
    # Same story for torch: vllm 0.32.0 pins torch==2.13.0 EXACTLY (run
    # 39313132178), so the torch frontier here is 2.13.0, not 2.14.x.
    "torch>=2.13.0,<2.14",
    "transformers>=5.16.1,<5.21",
    "datasets>=5.1.0,<6",
    "tokenizers>=0.23.0,<0.24",
    "accelerate>=1.15.0,<2",
    "deepspeed>=0.19.0,<0.20",
    "vllm>=0.32.0,<0.33",
    "wandb>=0.31.0",
    "sentencepiece>=0.2.0",
    "pydantic>=2.6.0",
    "click>=8.1.0",
    "trl>=1.16.0,<2",
    "peft>=0.21.0,<0.22",
    "lm-eval>=0.4.13,<0.5",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "datasketch>=1.6.0",
    "xxhash>=3.4.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "jsonlines>=4.0.0",
    "pyarrow>=15.0.0",
    "pandas>=2.2.0",
    "sentence-transformers>=6.1.0,<7",
    "faiss-cpu>=1.7.0",
    "langdetect>=1.0.9",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "jsonschema>=4.21.0",
    "hdbscan>=0.8.33",
    "numpy>=1.26.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    # 2026-10-18: range floors (not open floats) so a freshly released
    # linter can't re-break main overnight — synced with the range pins in
    # .github/workflows/model-stack-ci.yml "Install dev tools" and with
    # [tool.ruff] required-version below. Bump all three together.
    "ruff>=0.17.1,<0.18",
    "mypy>=2.4.0,<2.5",
    "types-PyYAML>=6.0.0",
    "types-tqdm>=4.66.0",
    "types-jsonschema>=4.21.0",
]
gpu = [
    "flash-attn>=2.8.3,<3",
    "faiss-gpu>=1.7.0",
    # GPTQ backend for transformers-native GPTQConfig quantization
    # (auto-gptq is unmaintained/dead — gptqmodel is the maintained fork).
    "gptqmodel>=7.6.0",
    # FP8/INT8 one-shot quantization producing compressed-tensors
    # checkpoints that vLLM serves natively (successor of the dead
    # autoawq path for production serving).
    "llmcompressor>=0.14.0",
    "bitsandbytes>=0.50.0",
]

[project.scripts]
ailin-ingest = "data.ingestion.ingest:cli"
ailin-dedup-lexical = "data.dedup.lexical_dedup:cli"
ailin-dedup-semantic = "data.dedup.semantic_dedup:cli"
ailin-quality-filter = "data.curation.quality_filter:cli"
ailin-pii-filter = "data.curation.pii_filter:cli"
ailin-contamination = "data.contamination.detect_contamination:cli"
ailin-mix = "data.mixing.mix_datasets:cli"
ailin-train-tokenizer = "tokenizer.training.train_tokenizer:cli"
ailin-eval-tokenizer = "tokenizer.evaluation.eval_tokenizer:cli"
ailin-scaling = "model.scaling.scaling_laws:cli"

[tool.setuptools.packages.find]
include = [
    "data*", "tokenizer*", "model*", "datasets*",
    "evals*", "registry*", "flywheel*",
    "serving*", "pretraining*", "alignment*", "experiments*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Must stay in lockstep with the range pins in the Model Stack CI workflow
# and the dev floors above — a local ruff outside this range fails loudly
# instead of silently reporting different rules than CI.
required-version = ">=0.17.1,<0.18"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# coord_serving.py: Pydantic models intentionally use camelCase to mirror
# the TypeScript wire contract in
# api/src/core/coordination/ensemble-coordinator-types.ts. Renaming would
# break the HTTP contract; using Field(alias=) on every field is noisy
# duplication. N815 must be suppressed here by design.
"serving/aggregation/coord_serving.py" = ["N815"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

# 2026-10-18 — torch (and torch-only) relaxation, scoped to the training-
# facing modules. torch is deliberately NOT installed in the CI lint env
# (its default pip wheel drags the multi-GB CUDA/nvidia-* stack — see the
# "Install dev tools" comment in .github/workflows/model-stack-ci.yml),
# so with --ignore-missing-imports every torch API resolves to Any. That
# makes two strict checks pure false positives there:
#   @torch.no_grad()      -> "Untyped decorator"  (disallow_untyped_decorators)
#   class X(nn.Module)    -> "Class cannot subclass Module (has type Any)"
#                                                          (disallow_subclassing_any)
# Only those two checks are disabled, only here; the modules remain
# otherwise fully strict. serving/, registry/, evals/, data/, flywheel/ and
# experiments/ keep the unmodified strict profile. Revisit if torch (CPU
# wheel) ever becomes installable in the lint job.
[[tool.mypy.overrides]]
module = [
  "model.*",
  "alignment.*",
  "pretraining.*",
]
disallow_untyped_decorators = false
disallow_subclassing_any = false

[tool.pytest.ini_options]
# Discover tests in:
#   - tests/                 — legacy / integration test home (may not exist
#                              on every checkout; pytest tolerates missing
#                              entries when at least one path resolves).
#   - <pkg>/__tests__/**     — co-located unit tests next to the modules
#                              they cover (Phase 2c onwards).
testpaths = [
    "tests",
    "alignment",
    "data",
    "model",
    "evals",
    "serving",
]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
