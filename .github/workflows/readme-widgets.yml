#
# Regenerates the README's self-hosted widgets directly in this repo: the
# star-history chart SVGs (light/dark) and the contributors avatar SVG.
# GitHub restricted the stargazers API to repo collaborators/admins on
# 2026-06-30, which broke third-party chart services (star-history.com and
# similar) for repos they do not administer; separately, the third-party
# contrib.rocks embed was found showing a stale, incomplete contributor list.
# This workflow runs in our own repo's own context (a collaborator request by
# definition) and reads both directly from the GitHub API, rendering static
# SVGs committed here instead of depending on either third party.
name: README widgets

on:
  schedule:
    - cron: '17 6 * * *' # daily, 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write # gh pr create/merge in the "Commit if changed" step

concurrency:
  group: readme-widgets
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Prefer a fine-grained PAT with Contents:Read-and-write on this
          # repo (required by GitHub's stargazer-API restriction); fall back
          # to the default Actions token.
          token: ${{ secrets.STARMAP_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Generate widgets
        env:
          GITHUB_TOKEN: ${{ secrets.STARMAP_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          node scripts/star-history/generate-chart.mjs
          node scripts/contributors/generate-contributors.mjs

      - name: Commit if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- .github/star-history/ .github/contributors/; then
            echo "No change in README widgets, nothing to commit."
            exit 0
          fi
          # main carries required status checks, so a direct push of a fresh
          # commit is always rejected (GH006): the pushed SHA has no check
          # runs on it yet. Land widget refreshes through a PR instead — the
          # required checks run against the PR head and auto-merge completes
          # the update once they pass. The bot identity is allowed by the
          # no-ai-attribution check; the DCO check needs a Signed-off-by
          # trailer on every PR commit.
          BR=chore/readme-widgets-auto
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BR"
          git add .github/star-history/ .github/contributors/
          git commit \
            -m "chore(readme-widgets): regenerate star history and contributors from live GitHub data" \
            -m "Signed-off-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          git push -f origin "$BR"
          PR=$(gh pr list --head "$BR" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            PR=$(gh pr create \
              --head "$BR" \
              --title "chore(readme-widgets): regenerate from live GitHub data" \
              --body "Automated refresh of the star-history and contributors widgets (scheduled run ${GITHUB_RUN_ID:-manual}).")
          fi
          # Repo-wide auto-merge is disabled, so merge explicitly: wait for
          # the required checks (they take a few seconds to register on a
          # freshly opened PR), then squash-merge once they pass.
          sleep 30
          gh pr checks "$PR" --watch --interval 30
          gh pr merge "$PR" --squash
