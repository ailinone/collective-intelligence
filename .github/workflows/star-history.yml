#
# Regenerates the star-history chart SVGs (light/dark) directly in this repo.
# GitHub restricted the stargazers API to repo collaborators/admins on
# 2026-06-30, which broke third-party chart services (star-history.com and
# similar) for repos they do not administer. This workflow runs in our own
# repo's own context, so it qualifies as a collaborator request and reads the
# same data directly, rendering static SVGs committed here instead of relying
# on any third-party rendering service.
name: Star history chart

on:
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: star-history-chart
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate chart SVGs
        env:
          # Prefer a fine-grained PAT with Contents:Read-and-write on this repo
          # (required by GitHub's stargazer-API restriction); fall back to the
          # default Actions token, which may or may not satisfy that check.
          GITHUB_TOKEN: ${{ secrets.STARMAP_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/star-history/generate-chart.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- .github/star-history/; then
            echo "No change in star history chart, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/star-history/
          git commit -m "chore(star-history): regenerate chart from live GitHub data"
          git push
